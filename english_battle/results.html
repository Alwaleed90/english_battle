<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حفل الأبطال الفائزين | English Battle</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
    <header class="top-nav">
        <a href="index.html" class="nav-brand">
            <div class="brand-icon">🏆</div>
            <div>
                <span class="brand-title font-en">ENGLISH BATTLE</span>
                <span class="brand-badge">حفل التتويج 🎉</span>
            </div>
        </a>
        <div class="nav-actions">
            <button id="btn-sound-toggle" class="btn-icon" title="كتم / تفعيل الصوت"><i class="fa-solid fa-volume-high"></i></button>
            <a href="index.html" class="btn btn-secondary btn-sm">🏠 الرئيسية</a>
            <a href="setup.html" class="btn btn-gold btn-sm">🎮 لعبة جديدة</a>
        </div>
    </header>

    <main class="results-container">
        <div id="winner-banner" class="winner-banner">
            <div class="winner-trophy">🏆</div>
            <h1 id="winner-announcement" style="font-size: 2.6rem; font-weight: 900; margin-bottom: 0.5rem; color: #1e293b;"></h1>
            <p id="winner-subtitle" style="font-size: 1.25rem; font-weight: 700; color: #475569;"></p>
        </div>
        <div id="podium-section" class="podium-grid"></div>
        <div class="card" style="margin-top: 2rem; text-align: right;">
            <div class="section-header">
                <h2 class="section-title">🌟 نتائج جميع الأبطال</h2>
            </div>
            <table class="stats-table">
                <thead>
                    <tr><th>المركز</th><th>اسم الفريق</th><th>مجموع النقاط</th><th>إجابات صحيحة 🌟</th><th>إجابات خاطئة ❌</th><th>الدقة</th></tr>
                </thead>
                <tbody id="stats-table-body"></tbody>
            </table>
        </div>
        <div id="category-leaders-card" class="card" style="margin-top: 1.5rem; text-align: right; display: none;">
            <div class="section-header">
                <h2 class="section-title">🏅 أوسمة التميز للأبطال</h2>
            </div>
            <div id="category-leaders-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;"></div>
        </div>
        <div style="display: flex; justify-content: center; gap: 1.2rem; flex-wrap: wrap; margin-top: 2.5rem;">
            <button id="btn-replay-same" class="btn btn-primary btn-lg">🔄 العب مرة أخرى بنفس الفرق!</button>
            <a href="setup.html" class="btn btn-gold btn-lg">🎨 لعبة جديدة</a>
            <a href="index.html" class="btn btn-secondary btn-lg">🏠 الرئيسية</a>
        </div>
    </main>

    <footer class="footer">
        <p>لعبة <strong>English Battle</strong> للأطفال &copy; 2026 | مبروك لكل الأبطال المشاركين! 🌈🏆</p>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/questions_data.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
